name: Build and Deploy Slidev Presentation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'  # You can change this to match the version you need

      # Install dependencies
      - name: Install dependencies
        run: |
          cd presentation  # Go into the presentation directory
          npm install

      # Build the Slidev presentation
      - name: Build the Slidev presentation
        run: |
          cd presentation
          npm run build -- --base '/intro-to-ml-GVP/'  # Adjust the base path as needed

      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ./presentation/dist # The folder the action should deploy.

      # Optionally, verify the deployed files
      - name: List the contents of the deployed folder
        run: |
          ls -alh ./presentation/dist
